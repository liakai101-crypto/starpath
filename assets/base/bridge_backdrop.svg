<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Purpose-built Command Core bridge interior backdrop.
       Replaces the thematically-wrong repair-bay illustration.
       Palette matches the app: deep navy hull, cyan/warm accent light. -->
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".45" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="vista" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1c2f47"/>
      <stop offset=".5" stop-color="#101c2f"/>
      <stop offset="1" stop-color="#070d18"/>
    </radialGradient>
    <radialGradient id="nebula" cx="62%" cy="36%" r="46%">
      <stop offset="0" stop-color="#6ce3f6" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#3a6d8c" stop-opacity=".07"/>
      <stop offset="1" stop-color="#0a1424" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmglow" cx="30%" cy="40%" r="34%">
      <stop offset="0" stop-color="#ffd89c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffd89c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="consoleface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="floorbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ce3f6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6ce3f6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6ce3f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- hull shell -->
  <rect width="1600" height="1000" fill="url(#hull)"/>

  <!-- forward viewport: wide canopy window onto space -->
  <g>
    <path d="M 210 96 Q 800 26 1390 96 L 1348 420 Q 800 476 252 420 Z" fill="url(#vista)"/>
    <path d="M 210 96 Q 800 26 1390 96 L 1348 420 Q 800 476 252 420 Z" fill="url(#nebula)"/>
    <path d="M 210 96 Q 800 26 1390 96 L 1348 420 Q 800 476 252 420 Z" fill="url(#warmglow)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="420" cy="170" r="1.6" opacity=".8"/>
      <circle cx="530" cy="240" r="1.1" opacity=".5"/>
      <circle cx="660" cy="140" r="1.3" opacity=".65"/>
      <circle cx="760" cy="300" r="1.0" opacity=".4"/>
      <circle cx="905" cy="180" r="1.7" opacity=".85"/>
      <circle cx="1010" cy="260" r="1.1" opacity=".5"/>
      <circle cx="1120" cy="150" r="1.4" opacity=".7"/>
      <circle cx="1235" cy="235" r="1.0" opacity=".45"/>
      <circle cx="1300" cy="330" r="1.2" opacity=".55"/>
      <circle cx="345" cy="300" r="1.2" opacity=".55"/>
      <circle cx="590" cy="345" r="0.9" opacity=".4"/>
      <circle cx="860" cy="90" r="1.2" opacity=".6"/>
    </g>
    <circle cx="1150" cy="205" r="26" fill="#ffe9c4" opacity=".14"/>
    <circle cx="1150" cy="205" r="10" fill="#ffe9c4" opacity=".38"/>
    <!-- distant lane line -->
    <path d="M 300 330 Q 800 280 1290 316" stroke="#6ce3f6" stroke-opacity=".18" stroke-width="2" fill="none"/>
  </g>

  <!-- window frame + mullions -->
  <g stroke="#1b2942" fill="none">
    <path d="M 210 96 Q 800 26 1390 96 L 1348 420 Q 800 476 252 420 Z" stroke-width="14" stroke-opacity=".9"/>
    <path d="M 500 62 L 470 446" stroke-width="10" stroke-opacity=".85"/>
    <path d="M 800 40 L 800 462" stroke-width="10" stroke-opacity=".85"/>
    <path d="M 1100 62 L 1130 446" stroke-width="10" stroke-opacity=".85"/>
  </g>
  <g stroke="#2c405f" fill="none" stroke-opacity=".5">
    <path d="M 210 96 Q 800 26 1390 96" stroke-width="3"/>
  </g>

  <!-- canopy ribs above the window -->
  <g stroke="#141f33" fill="none">
    <path d="M 120 120 Q 800 -30 1480 120" stroke-width="26" stroke-opacity=".9"/>
    <path d="M 60 210 Q 800 30 1540 210" stroke-width="18" stroke-opacity=".65"/>
    <path d="M 20 300 Q 800 96 1580 300" stroke-width="12" stroke-opacity=".4"/>
  </g>
  <path d="M 120 120 Q 800 -30 1480 120" stroke="#6ce3f6" stroke-opacity=".06" stroke-width="30" fill="none"/>

  <!-- rear bulkheads flanking the window -->
  <g fill="#0a1120">
    <path d="M 0 60 L 218 92 L 258 428 L 0 470 Z" opacity=".92"/>
    <path d="M 1600 60 L 1382 92 L 1342 428 L 1600 470 Z" opacity=".92"/>
  </g>
  <g stroke="#182740" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M 64 120 L 96 430"/>
    <path d="M 1536 120 L 1504 430"/>
  </g>
  <!-- bulkhead status lights -->
  <g>
    <rect x="96" y="200" width="34" height="5" rx="2.5" fill="#6ce3f6" opacity=".24"/>
    <rect x="96" y="216" width="22" height="5" rx="2.5" fill="#ffd89c" opacity=".18"/>
    <rect x="1470" y="200" width="34" height="5" rx="2.5" fill="#6ce3f6" opacity=".24"/>
    <rect x="1482" y="216" width="22" height="5" rx="2.5" fill="#ffd89c" opacity=".18"/>
  </g>

  <!-- deck floor -->
  <rect y="470" width="1600" height="530" fill="url(#floor)"/>
  <!-- floor perspective lines converging toward center -->
  <g stroke="#16233a" stroke-width="2" stroke-opacity=".55">
    <path d="M 800 476 L 800 1000" stroke-opacity=".3"/>
    <path d="M 620 480 L 360 1000"/>
    <path d="M 980 480 L 1240 1000"/>
    <path d="M 470 478 L 40 1000"/>
    <path d="M 1130 478 L 1560 1000"/>
  </g>
  <g stroke="#16233a" stroke-width="2" stroke-opacity=".4">
    <path d="M 252 520 Q 800 486 1348 520"/>
    <path d="M 160 620 Q 800 570 1440 620"/>
    <path d="M 40 780 Q 800 706 1560 780"/>
  </g>
  <!-- floor light strips -->
  <rect x="240" y="522" width="1120" height="4" rx="2" fill="url(#floorbeam)" opacity=".7"/>
  <rect x="120" y="784" width="1360" height="5" rx="2.5" fill="url(#floorbeam)" opacity=".45"/>

  <!-- side consoles (silhouettes, angled toward center) -->
  <g>
    <path d="M 30 560 L 330 596 L 330 760 L 30 830 Z" fill="url(#consoleface)"/>
    <path d="M 30 560 L 330 596 L 330 612 L 30 578 Z" fill="#15243c"/>
    <rect x="70" y="640" width="90" height="8" rx="4" fill="#6ce3f6" opacity=".16"/>
    <rect x="70" y="662" width="56" height="6" rx="3" fill="#6ce3f6" opacity=".10"/>
    <rect x="180" y="648" width="70" height="6" rx="3" fill="#ffd89c" opacity=".12"/>
    <path d="M 1570 560 L 1270 596 L 1270 760 L 1570 830 Z" fill="url(#consoleface)"/>
    <path d="M 1570 560 L 1270 596 L 1270 612 L 1570 578 Z" fill="#15243c"/>
    <rect x="1440" y="640" width="90" height="8" rx="4" fill="#6ce3f6" opacity=".16"/>
    <rect x="1350" y="648" width="70" height="6" rx="3" fill="#ffd89c" opacity=".12"/>
  </g>

  <!-- central dais shadow where the CSS reactor sits -->
  <ellipse cx="800" cy="800" rx="360" ry="96" fill="#030509" opacity=".55"/>
  <ellipse cx="800" cy="792" rx="250" ry="62" fill="#0d1728" opacity=".5"/>
  <ellipse cx="800" cy="792" rx="250" ry="62" fill="none" stroke="#6ce3f6" stroke-opacity=".10" stroke-width="2"/>
</svg>
